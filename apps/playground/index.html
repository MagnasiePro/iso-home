<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>IsoHome Playground</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1a1410;
        overflow: hidden;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      #debug {
        position: fixed;
        top: 8px;
        left: 8px;
        color: #e8dcc2;
        font-family: monospace;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.5);
        padding: 4px 8px;
        border-radius: 4px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="debug">redraws: 0</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
